services:
  db:
    image: postgres:16-alpine
    container_name: chess-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chessdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chessdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chess-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gameserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess-gameserver
    restart: always
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/chessdb
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 150000
        hard: 150000

  loadtester:
    build:
      context: .
      dockerfile: Dockerfile.loadtest
    container_name: chess-loadtester
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gameserver:
        condition: service_started
    ulimits:
      nofile:
        soft: 150000
        hard: 150000

volumes:
  postgres_data:
  redis_data:
