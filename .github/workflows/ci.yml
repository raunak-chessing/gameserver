name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # -p 1: run packages serially. Several tests share a single Redis
        # queue namespace (by design — they're proving cross-instance
        # matchmaking works against one Redis), so running packages in
        # parallel against the same service container lets one package's
        # matchmaker steal another's in-flight match.
        run: go test ./... -p 1 -v
